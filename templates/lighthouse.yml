name: Lighthouse CI

# Drop-in workflow for an Astro site: copy this file to
# .github/workflows/lighthouse.yml in your project, next to lighthouserc.json
# and lighthouserc.mobile.json from
# https://github.com/TicketWaveHQ/astro-performance-budget
#
# It runs a production build, serves dist/ with LHCI's own static server, and
# asserts both budgets. With no `url` list in the configs, LHCI tests up to
# five HTML pages it finds in dist/. The job fails if any "error" assertion
# is broken.
#
# Assumes npm with a committed package-lock.json. For pnpm or Yarn, change the
# cache and install steps.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Allow manual runs from the Actions tab.
  workflow_dispatch:

# Cancel superseded runs on the same ref to save minutes.
concurrency:
  group: lighthouse-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lighthouse:
    name: Assert performance budget
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Astro site
        run: npm run build
        env:
          # Keep the build deterministic; do not phone home during CI.
          ASTRO_TELEMETRY_DISABLED: "1"

      # 0.15.x runs Lighthouse 12, which has every audit the budgets assert.
      - name: Install Lighthouse CI
        run: npm install --global @lhci/cli@0.15.x

      # `--collect.staticDistDir` tells LHCI to spin up its own static server
      # against the built output, so there is no need to run `astro preview`.
      - name: Run Lighthouse CI (desktop budget)
        run: lhci autorun --config=./lighthouserc.json --collect.staticDistDir=./dist

      - name: Run Lighthouse CI (mobile budget)
        run: lhci autorun --config=./lighthouserc.mobile.json --collect.staticDistDir=./dist
