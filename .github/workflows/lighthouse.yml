name: Lighthouse CI

# Runs a production build of the Astro site, serves it locally, and asserts the
# performance budget in lighthouserc.json against every changed page. The job
# fails the pull request if any budget in the "assert" block is broken.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Allow manual runs from the Actions tab.
  workflow_dispatch:

# Cancel superseded runs on the same ref to save minutes.
concurrency:
  group: lighthouse-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # Needed only if you enable the status-comment step below.
  pull-requests: write

jobs:
  lighthouse:
    name: Assert performance budget
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Astro site
        run: npm run build
        env:
          # Keep the build deterministic; do not phone home during CI.
          ASTRO_TELEMETRY_DISABLED: "1"

      - name: Install Lighthouse CI
        run: npm install --global @lhci/cli@0.14.x

      # `staticDistDir` in lighthouserc.json (or the flag below) tells LHCI to
      # spin up its own static server against the built output, so there is no
      # need to run `astro preview` yourself.
      - name: Run Lighthouse CI (desktop budget)
        run: lhci autorun --config=./lighthouserc.json --collect.staticDistDir=./dist

      - name: Run Lighthouse CI (mobile budget)
        run: lhci autorun --config=./lighthouserc.mobile.json --collect.staticDistDir=./dist

      # Optional: post the result links back onto the pull request. Requires the
      # pull-requests: write permission granted above. Remove if you do not want
      # the bot to comment.
      - name: Comment budget summary on PR
        if: always() && github.event_name == 'pull_request'
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const summary = 'Lighthouse CI budget check finished. See the job logs and the temporary-public-storage report links above for full details.';
            const { owner, repo } = context.repo;
            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: context.issue.number,
              body: summary,
            });
